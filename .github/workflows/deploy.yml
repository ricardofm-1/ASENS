name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refreshes public/names.json so the site has little chain history left to scan.
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # On failure the committed names.json is used; the site scans the gap itself.
      - run: node scripts/snapshot-names.mjs || git checkout -- public/names.json
      - run: npm run build
      # Pages has no SPA rewrites; serving index.html as 404 keeps /name/... links working.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
